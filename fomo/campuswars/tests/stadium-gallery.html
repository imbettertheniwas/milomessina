<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memorial Stadium preview</title>
<style>body{margin:0;background:#98a7ba;font:13px Arial;color:white}nav{position:fixed;top:15px;left:15px;right:15px;display:flex;gap:8px;flex-wrap:wrap}button,output{border:1px solid #ffffff44;background:#152738;color:white;padding:11px;border-radius:7px}button{cursor:pointer}output{position:fixed;bottom:15px;left:15px;max-width:85vw}</style>
<nav><button id="aerial">Stadium</button><button id="stands">From the stands</button><button id="field">Sideline</button><button id="night">Day / night</button><button id="pause">Pause</button><button id="touchdown">Touchdown</button><button id="fireworks">Fireworks</button></nav><output id="stats">Loading…</output>
<script type="module">
import * as T from '../vendor/three.module.min.js';
import {createStadium} from '../village-stadium.js?v=89';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x98a7ba);scene.fog=new T.FogExp2(0x98a7ba,.0022);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,500);
const ambient=new T.HemisphereLight(0xd4e2ed,0x857768,1.55),sun=new T.DirectionalLight(0xffe5c6,2.6);sun.position.set(-35,55,225);sun.target.position.set(0,0,200);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,near:1,far:160});sun.shadow.normalBias=.04;scene.add(ambient,sun,sun.target);
const stadium=createStadium(T);scene.add(stadium.root);const floor=new T.Mesh(new T.PlaneGeometry(1000,1000),new T.MeshStandardMaterial({color:0x708453}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function view(x,y,z,tx,ty,tz){camera.position.set(x,y,z);camera.lookAt(tx,ty,tz);camera.updateMatrixWorld();renderer.shadowMap.needsUpdate=true;}
document.getElementById('aerial').onclick=()=>view(-66,65,135,0,2,200);document.getElementById('stands').onclick=()=>view(-26,8,184,0,1,201);document.getElementById('field').onclick=()=>view(-14,2.3,182,3,1.5,196);
let night=false,paused=false,time=0,last=performance.now(),frames=0,mark=last,fps=0;
document.getElementById('night').onclick=()=>{night=!night;scene.background.set(night?0x25233f:0x98a7ba);scene.fog.color.copy(scene.background);ambient.intensity=night?.83:1.55;sun.intensity=night?.42:2.6;stadium.setNight(night);renderer.shadowMap.needsUpdate=true;};document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};document.getElementById('touchdown').onclick=()=>{time=19;paused=true;document.getElementById('pause').textContent='Resume';};
document.getElementById('fireworks').onclick=()=>{if(!night)document.getElementById('night').click();time=2.5;paused=true;document.getElementById('pause').textContent='Resume';view(-100,85,105,0,24,200);};
view(-66,65,135,0,2,200);
function draw(now){if(!paused&&!document.hidden)time+=Math.max(0,Math.min(.05,(now-last)/1000));last=now;stadium.animate(time);renderer.render(scene,camera);frames++;if(now-mark>1000){fps=Math.round(frames*1000/(now-mark));frames=0;mark=now;}document.getElementById('stats').textContent=`${stadium.fanCount.toLocaleString()} fans · 22 players · ${fps} fps · ${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} triangles · ${time.toFixed(1)}s`;requestAnimationFrame(draw);}requestAnimationFrame(draw);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172333">
<title>Rasmr & Orangie · Helipad preview</title>
<style>
  *{box-sizing:border-box}body{margin:0;height:100dvh;min-height:420px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#172333;font:13px system-ui;color:#f6f3ed}header{padding:14px 18px 12px;background:#172333}h1{margin:0 0 10px;font-size:15px;font-weight:650}nav{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #ffffff25;background:#263444;color:inherit;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}button:hover{background:#35485c}button[aria-pressed=true]{background:#ecddc4;color:#172333;border-color:#ecddc4}button:focus-visible,input:focus-visible{outline:2px solid #ecddc4;outline-offset:3px}#viewport{position:relative;min-width:0;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%}#view-label{position:absolute;top:13px;left:18px;padding:6px 9px;background:#172333bd;border-radius:6px;pointer-events:none;font-size:12px}footer{padding:11px 18px 14px;background:#172333}.playback{display:flex;align-items:center;gap:11px}.playback button{min-width:65px}label{white-space:nowrap}input{min-width:0;width:100%;accent-color:#ecddc4;cursor:pointer}#timestamp{min-width:78px;text-align:right;font-variant-numeric:tabular-nums}#stats{display:block;color:#b9c5d0;font-size:11px;margin-top:9px;line-height:1.4}@media(max-width:600px){header{padding:12px}h1{font-size:14px;margin-bottom:9px}nav{gap:5px}nav button{font-size:11px;padding:8px 9px}footer{padding:10px 12px 12px}.playback{gap:7px}.playback label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#timestamp{font-size:11px;min-width:68px}#view-label{left:12px;top:12px}}
</style>
<header>
  <h1>Rasmr & Orangie · Helicopter arrival</h1>
  <nav aria-label="Preview views">
    <button data-view="scene" aria-pressed="true">Scene</button>
    <button data-view="portrait" aria-pressed="false">Meet them</button>
    <button data-view="profile" aria-pressed="false">Portrait profile</button>
    <button data-view="maybach" aria-pressed="false">Maybach front</button>
    <button data-view="car-side" aria-pressed="false">Maybach side</button>
    <button data-view="car-rear" aria-pressed="false">Maybach rear</button>
    <button data-view="helicopter" aria-pressed="false">Helicopter</button>
    <button id="boarding">Boarding</button>
    <button data-view="flight" aria-pressed="false">Flight</button>
    <button id="arrival">Replay arrival</button>
    <button id="night" aria-pressed="false">Night</button>
  </nav>
</header>
<main id="viewport" aria-label="Interactive helipad preview"><span id="view-label">The complete scene</span></main>
<footer>
  <div class="playback">
    <button id="pause">Play</button>
    <label for="timeline">Timeline</label>
    <input id="timeline" type="range" min="0" max="95.95" step="0.05" value="27" aria-label="Arrival timeline in seconds">
    <output id="timestamp" for="timeline">27.0 / 96s</output>
  </div>
  <output id="stats" aria-live="off"></output>
</footer>
<script type="module">
import * as T from '../vendor/three.module.min.js';
import {createHelipad,HELIPAD_CYCLE} from '../village-helipad.js?v=realism-gallery-2';

const viewport=document.getElementById('viewport');
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
viewport.prepend(renderer.domElement);
const scene=new T.Scene();
scene.background=new T.Color(0xb6c1c9);
scene.environmentIntensity=.75;
const camera=new T.PerspectiveCamera(36,1,.04,500);
const ambient=new T.HemisphereLight(0xe3edf6,0x827260,1.15);
const sun=new T.DirectionalLight(0xffefd9,2.1);
const fill=new T.DirectionalLight(0xcbddeb,.45);
sun.position.set(-22,36,25);fill.position.set(24,10,-16);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-31,right:31,top:31,bottom:-31,near:1,far:105});
sun.shadow.normalBias=.025;sun.shadow.bias=-.0001;sun.shadow.radius=3;
sun.target.position.set(-4,0,3);
scene.add(ambient,sun,sun.target,fill);

// A local sky and broad photographic light panels make metal and glass reflect
// their surroundings, without loading a remote environment or artwork.
const environment=new T.Scene();
const skyGeometry=new T.SphereGeometry(70,32,16);
const skyMaterial=new T.ShaderMaterial({
  side:T.BackSide,
  uniforms:{sky:{value:new T.Color(0xc8dbea)},horizon:{value:new T.Color(0xe4e0d7)},ground:{value:new T.Color(0x655e54)}},
  vertexShader:'varying vec3 vPosition;void main(){vPosition=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 sky;uniform vec3 horizon;uniform vec3 ground;varying vec3 vPosition;void main(){float y=normalize(vPosition).y;vec3 color=y>0.0?mix(horizon,sky,smoothstep(0.0,0.65,y)):mix(horizon,ground,smoothstep(0.0,0.45,-y));gl_FragColor=vec4(color,1.0);}'
});
environment.add(new T.Mesh(skyGeometry,skyMaterial));
const panels=[];
for(const [x,y,z,w,h,intensity] of [[-12,17,12,14,18,3.2],[18,12,-8,10,20,1.5],[0,25,-18,22,7,2.2]]){
  const geometry=new T.PlaneGeometry(w,h),material=new T.MeshBasicMaterial({color:new T.Color().setScalar(intensity),side:T.DoubleSide});
  const panel=new T.Mesh(geometry,material);panel.position.set(x,y,z);panel.lookAt(0,0,0);environment.add(panel);panels.push({geometry,material});
}
const pmrem=new T.PMREMGenerator(renderer);
const environmentMap=pmrem.fromScene(environment,.03,.1,150);
scene.environment=environmentMap.texture;
pmrem.dispose();skyGeometry.dispose();skyMaterial.dispose();
for(const {geometry,material} of panels){geometry.dispose();material.dispose();}

const floor=new T.Mesh(new T.PlaneGeometry(600,600),new T.MeshStandardMaterial({color:0x929981,roughness:.96}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const helipad=createHelipad(T);helipad.root.position.set(0,0,0);scene.add(helipad.root);
// The gallery can redraw moving shadows every frame; production uses its own
// cached-shadow policy and moving contact shadows.
helipad.root.traverse(o=>{if(o.isMesh&&!o.material.transparent)o.castShadow=true;});

const timeline=document.getElementById('timeline'),timestamp=document.getElementById('timestamp'),stats=document.getElementById('stats');
const pause=document.getElementById('pause'),viewLabel=document.getElementById('view-label');
let time=27,playing=false,night=false,view='scene',last=0;
const labels={scene:'The complete scene',portrait:'Rasmr & Orangie · front',profile:'Rasmr & Orangie · profile',maybach:'Maybach · front three-quarter','car-side':'Maybach · passenger side','car-rear':'Maybach · rear three-quarter',helicopter:'Helicopter · cockpit and cabin',flight:'Flight over the village'};

function fit(bounds,direction,padding=1.12){
  const target=bounds.getCenter(new T.Vector3()),forward=new T.Vector3(...direction).normalize();
  const right=new T.Vector3().crossVectors(new T.Vector3(0,1,0),forward).normalize();
  const up=new T.Vector3().crossVectors(forward,right);
  const vertical=Math.tan(T.MathUtils.degToRad(camera.fov/2))/padding,horizontal=vertical*camera.aspect;
  let distance=0;
  for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z]){
    const corner=new T.Vector3(x,y,z).sub(target),depth=corner.dot(forward);
    distance=Math.max(distance,Math.abs(corner.dot(right))/horizontal+depth,Math.abs(corner.dot(up))/vertical+depth);
  }
  camera.position.copy(target).addScaledVector(forward,Math.max(1,distance));camera.lookAt(target);
}
function frame(){
  helipad.update(time);helipad.root.updateMatrixWorld(true);
  // Keep the aircraft from obscuring close car views in narrow panels.
  helipad.heli.visible=!['maybach','car-side','car-rear'].includes(view);
  camera.fov=view==='portrait'||view==='profile'?30:36;camera.updateProjectionMatrix();
  const bounds=new T.Box3();
  if(view==='portrait'||view==='profile'){
    for(const guest of helipad.guests)bounds.union(new T.Box3().setFromObject(guest.head));
    bounds.min.y-=.64;bounds.max.y+=.33;bounds.expandByVector(new T.Vector3(camera.aspect<1?.42:.15,0,.06));
    fit(bounds,view==='profile'?[1,.07,.62]:[.02,.035,1],1.12);
  }else if(view==='maybach'||view==='car-side'||view==='car-rear'){
    bounds.setFromObject(helipad.car);
    fit(bounds,view==='maybach'?[.78,.30,-1]:view==='car-rear'?[-.78,.25,1]:[1,.13,.03],1.18);
  }else if(view==='helicopter'){
    bounds.setFromObject(helipad.heli);fit(bounds,[-1,.40,1.3],1.13);
  }else if(view==='flight'){
    bounds.set(new T.Vector3(-30,0,-44),new T.Vector3(23,43,23));fit(bounds,[-.9,.55,1],1.1);
  }else{
    bounds.set(new T.Vector3(-23,0,-20),new T.Vector3(17,6.8,22));fit(bounds,[-.9,.61,1],1.08);
  }
  viewLabel.textContent=labels[view];
  document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));
}
function setPlaying(value){playing=value;pause.textContent=playing?'Pause':'Play';}
function seek(t,v=view){time=t;view=v;setPlaying(false);frame();}
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>seek(button.dataset.view==='flight'?55:27,button.dataset.view);
document.getElementById('boarding').onclick=()=>seek(38,'scene');
document.getElementById('arrival').onclick=()=>{seek(0,'scene');setPlaying(true);};
pause.onclick=()=>setPlaying(!playing);
timeline.oninput=()=>{time=Number(timeline.value);setPlaying(false);frame();};
document.getElementById('night').onclick=e=>{
  night=!night;helipad.setNight(night);ambient.intensity=night?.45:1.15;sun.intensity=night?.30:2.1;fill.intensity=night?.22:.45;
  scene.environmentIntensity=night?.24:.75;scene.background.set(night?0x232b40:0xb6c1c9);e.target.setAttribute('aria-pressed',String(night));
};
function resize(){const {width,height}=viewport.getBoundingClientRect();camera.aspect=width/height;renderer.setSize(width,height,false);frame();}
new ResizeObserver(resize).observe(viewport);
document.addEventListener('village:artwork',()=>{if(view==='portrait'||view==='profile')frame();});
resize();
function draw(now){
  if(playing&&last)time=(time+Math.min((now-last)/1000,.05))%HELIPAD_CYCLE;last=now;
  const state=helipad.update(time);renderer.render(scene,camera);
  timeline.value=state.time;timestamp.textContent=`${state.time.toFixed(1)} / ${HELIPAD_CYCLE}s`;
  stats.textContent=`${state.phase} · ${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} triangles`;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</html>

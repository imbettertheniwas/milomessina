<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rasmr & Orangie · Helipad preview</title><style>body{margin:0;background:#98a7ba;font:14px system-ui;color:white}nav{position:fixed;top:16px;left:16px;right:16px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}button{border:1px solid #ffffff30;background:#172333;color:white;border-radius:9px;padding:10px 14px;cursor:pointer}output{position:fixed;bottom:18px;left:18px;padding:12px 16px;background:#172333;border-radius:9px}</style><nav><button id="scene">Scene</button><button id="portrait">Meet them</button><button id="maybach">Maybach</button><button id="arrival">Replay arrival</button><button id="boarding">Boarding</button><button id="flight">Flight</button><button id="pause">Play</button><button id="night">Night</button></nav><output id="stats"></output><script type="module">
import * as T from '../vendor/three.module.min.js';import {createHelipad} from '../village-helipad.js?v=1';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x98a7ba);const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.1,500);
const ambient=new T.HemisphereLight(0xd4e2ed,0x857768,1.55),sun=new T.DirectionalLight(0xffe5c6,2.6),fill=new T.DirectionalLight(0xc4d2e0,.5);sun.position.set(-35,55,30);fill.position.set(30,15,-25);scene.add(ambient,sun,fill);
const floor=new T.Mesh(new T.PlaneGeometry(600,600),new T.MeshStandardMaterial({color:0x8a9477}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const helipad=createHelipad(T);helipad.root.position.set(0,0,0);scene.add(helipad.root);let time=27,playing=false,night=false,view='scene',last=0;
function frame(){const aspect=Math.min(1,camera.aspect);if(view==='portrait'){camera.position.set(-3.1,2.3,9);camera.lookAt(-3.1,1.3,4.65);}else if(view==='maybach'){camera.position.set(-18,3.8,18);camera.lookAt(-12,1,10);}else if(view==='flight'){camera.position.set(-55,45,62);camera.lookAt(0,20,0);}else{camera.position.set(-30/aspect,17/aspect,34/aspect);camera.lookAt(-4,1,2);}}
frame();function draw(now){if(playing&&last)time+=Math.min((now-last)/1000,.05);last=now;const s=helipad.update(time);renderer.render(scene,camera);document.getElementById('stats').textContent=`${s.phase} · ${s.time.toFixed(1)}s · ${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} triangles`;requestAnimationFrame(draw);}requestAnimationFrame(draw);
const seek=(t,v)=>{time=t;playing=false;view=v;frame();document.getElementById('pause').textContent='Play';};document.getElementById('scene').onclick=()=>seek(27,'scene');document.getElementById('portrait').onclick=()=>seek(27,'portrait');document.getElementById('maybach').onclick=()=>seek(10,'maybach');document.getElementById('boarding').onclick=()=>seek(38,'scene');document.getElementById('flight').onclick=()=>seek(51,'flight');document.getElementById('arrival').onclick=()=>{seek(0,'scene');playing=true;document.getElementById('pause').textContent='Pause';};document.getElementById('pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';};document.getElementById('night').onclick=()=>{night=!night;helipad.setNight(night);ambient.intensity=night?.83:1.55;sun.intensity=night?.42:2.6;scene.background.set(night?0x25233f:0x98a7ba);};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);frame();});
</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1,000-house village performance preview</title>
<style>body{margin:0;background:#98a7ba;font:12px Arial;color:white}nav{position:fixed;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px}button,output{padding:10px;border:1px solid #ffffff55;border-radius:8px;color:white;background:#142638}button{cursor:pointer}output{position:fixed;bottom:12px;left:12px;max-width:92vw;line-height:1.6}</style>
<nav><button id="desktop">Desktop stress test</button><button id="row">Greek Row</button><button id="last">Visit house 1,000</button><button id="overview">Wide view</button><button id="stadium">Stadium</button><button id="night">Day / night</button><button id="pause">Pause activity</button></nav><output id="stats">Building the preview…</output>
<script type="module">
import * as T from '../vendor/three.module.min.js';import {createVillageRenderer} from '../village-renderer.js?v=97';import {createDistricts} from '../village-districts.js?v=99';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x98a7ba);scene.fog=new T.FogExp2(0x98a7ba,.0022);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,1,650);camera.position.set(0,8,38);camera.lookAt(0,2,-50);camera.updateMatrixWorld();
const ambient=new T.HemisphereLight(0xd4e2ed,0x857768,1.55),sun=new T.DirectionalLight(0xffe5c6,2.6);sun.position.set(-35,55,30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-48,right:48,top:48,bottom:-48,near:1,far:150});sun.shadow.normalBias=.05;sun.shadow.bias=-.00015;scene.add(ambient,sun,sun.target);
const rows=Array.from({length:1000},(_,i)=>({id:`scale-${String(i).padStart(4,'0')}`,name:'Alpha Beta',letters:'ΑΒ',school:'University of Tampa',shortSchool:'Tampa',joined:20,active:100}));
const started=performance.now(),village=createVillageRenderer(T,rows,{camera}),districts=createDistricts(T,village.extension,village.streetTotal);scene.add(village.world,districts.root);const buildMs=performance.now()-started;
let target=new T.Vector3(0,2,0),night=false,paused=false,time=0,last=performance.now(),mark=last,frames=0,fps=0;
function view(x,y,z,tx,ty,tz){camera.position.set(x,y,z);target.set(tx,ty,tz);camera.lookAt(target);camera.updateMatrixWorld();sun.position.set(tx-35,55,tz+30);sun.target.position.set(tx,0,tz);renderer.shadowMap.needsUpdate=true;}
document.getElementById('desktop').onclick=()=>{camera.aspect=1280/720;camera.updateProjectionMatrix();renderer.setSize(1280,720);view(100,165,240,0,2,60);};
document.getElementById('row').onclick=()=>village.focus(rows[0].id,()=>view(0,8,38,0,2,-50));document.getElementById('last').onclick=()=>{const a=village.anchors.find(a=>a.id===rows.at(-1).id);village.focus(a.id,()=>view(a.lot.originX,10,a.lot.z+25,a.lot.x,3,a.lot.z));};document.getElementById('overview').onclick=()=>view(100,165,240,0,2,60);document.getElementById('stadium').onclick=()=>view(-66,65,135+village.extension,0,2,200+village.extension);
document.getElementById('night').onclick=()=>{night=!night;scene.background.set(night?0x25233f:0x98a7ba);scene.fog.color.copy(scene.background);ambient.intensity=night?.83:1.55;sun.intensity=night?.42:2.6;village.nightLife.setNight(night);districts.setNight(night);renderer.shadowMap.needsUpdate=true;};document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume activity':'Pause activity';};
function draw(now){const frameStart=performance.now();if(!paused&&!document.hidden)time+=Math.max(0,Math.min(.05,(now-last)/1000));last=now;if(village.updateView(camera))renderer.shadowMap.needsUpdate=true;if(districts.update(target.x,target.z))renderer.shadowMap.needsUpdate=true;const beforeCrowd=performance.now();village.animateCrowd(time,camera);const afterCrowd=performance.now();village.animateEffects(time);const beforeDistrict=performance.now();districts.animate(time,target.x,target.z,camera);const cpuMs=performance.now()-frameStart;renderer.render(scene,camera);const renderMs=performance.now()-frameStart-cpuMs;frames++;if(now-mark>1000){fps=Math.round(frames*1000/(now-mark));frames=0;mark=now;}document.getElementById('stats').textContent=`${renderer.domElement.width}×${renderer.domElement.height} pixels · 1,000 houses / 20,000 members · ${village.residentCount} resident lots · ${village.parts.torso.count+(village.distantCrowd?.mesh.count||0)} visible members (${village.parts.torso.count} close detail) · ${fps} fps (${Math.round(beforeCrowd-frameStart)} view / ${Math.round(afterCrowd-beforeCrowd)} crowd / ${Math.round(beforeDistrict-afterCrowd)} effects / ${Math.round(cpuMs-(beforeDistrict-frameStart))} district / ${Math.round(renderMs)} render ms) · ${renderer.info.render.calls} draws · ${renderer.info.render.triangles.toLocaleString()} triangles · ${renderer.info.memory.textures} textures · ${Math.round(buildMs)} ms initial build${village.building?' · Preparing nearby houses…':''}`;requestAnimationFrame(draw);}requestAnimationFrame(draw);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
